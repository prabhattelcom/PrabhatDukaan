
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prabhat Dukaan Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4f9;font-family:Arial;color:#182238}
header{background:#102d55;color:white;padding:20px;text-align:center}
.logo{width:76px;height:76px;border:3px solid #d8ad48;border-radius:50%;display:grid;place-items:center;margin:auto auto 8px;font-size:30px;font-weight:bold;color:#f4ce72}
main{max-width:800px;margin:auto;padding:14px}
.card{background:white;padding:16px;border-radius:13px;margin:13px 0;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd3df;border-radius:8px;font-size:16px}
button{padding:11px 15px;border:0;border-radius:8px;background:#145ba0;color:white;font-weight:bold;margin:5px 3px}
button.red{background:#b72d32}
button.green{background:#16804a}
.hidden{display:none}
img.preview{max-width:150px;max-height:150px;object-fit:contain;display:block;margin:10px 0}
.item{border-bottom:1px solid #ddd;padding:12px 0}
.small{color:#667085;font-size:13px}
</style>
</head>
<body>
<header>
<div class="logo">PT</div>
<h2>Prabhat Dukaan</h2>
<p>Prabhat Telecom – Admin Panel</p>
</header>
<main>
<section id="login" class="card">
<h3>Admin Login</h3>
<input id="email" type="email" value="prbhtm@gmail.com" placeholder="Email">
<input id="password" type="password" placeholder="Admin Password">
<button onclick="loginAdmin()">लॉगिन करें</button>
<p id="loginMsg"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h3>Admin Dashboard</h3>
<p id="welcome"></p>
<button onclick="loadAll()">रिफ्रेश करें</button>
<button class="red" onclick="logout()">लॉगआउट</button>
</div>

<div class="card">
<h3>नया सामान जोड़ें</h3>
<input id="pname" placeholder="सामान का नाम">
<input id="mrp" type="number" placeholder="MRP">
<input id="price" type="number" placeholder="बिक्री मूल्य">
<input id="stock" type="number" placeholder="स्टॉक">
<textarea id="desc" placeholder="सामान की जानकारी"></textarea>
<label><b>Gallery से फोटो चुनें</b></label>
<input id="photo" type="file" accept="image/*">
<img id="preview" class="preview hidden">
<button class="green" onclick="saveProduct()">सामान सेव करें</button>
<p id="productMsg"></p>
</div>

<div class="card">
<h3>आपके प्रोडक्ट</h3>
<div id="productList">लोड हो रहा है...</div>
</div>

<div class="card">
<h3>ग्राहकों के ऑर्डर</h3>
<div id="orderList">लोड हो रहा है...</div>
</div>
</section>
</main>

<script>
const URL="https://zbsmdnccdpidksgavtxl.supabase.co";
const KEY="sb_publishable_jIxfhg8WH0x0XH3edKOA5Q_jAFQl1v2";
const ADMIN="prbhtm@gmail.com";
const db=window.supabase.createClient(URL,KEY);

const el=id=>document.getElementById(id);
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupees=n=>"₹"+Number(n||0).toFixed(2);

el("photo").addEventListener("change",()=>{
 const f=el("photo").files[0];
 if(!f)return;
 el("preview").src=URL.createObjectURL(f);
 el("preview").classList.remove("hidden");
});

async function loginAdmin(){
 el("loginMsg").textContent="लॉगिन हो रहा है...";
 const email=el("email").value.trim();
 if(email.toLowerCase()!==ADMIN){el("loginMsg").textContent="Admin Email गलत है";return}
 const {data,error}=await db.auth.signInWithPassword({email,password:el("password").value});
 if(error){el("loginMsg").textContent=error.message;return}
 await checkLogin();
}

async function checkLogin(){
 const {data}=await db.auth.getSession();
 const user=data.session?.user;
 if(user?.email?.toLowerCase()===ADMIN){
  el("login").classList.add("hidden");
  el("dashboard").classList.remove("hidden");
  el("welcome").textContent="लॉगिन: "+user.email;
  loadAll();
 }else{
  el("login").classList.remove("hidden");
  el("dashboard").classList.add("hidden");
 }
}

async function logout(){await db.auth.signOut();checkLogin()}

async function saveProduct(){
 const name=el("pname").value.trim();
 const mrp=Number(el("mrp").value);
 const selling_price=Number(el("price").value);
 const stock=Number(el("stock").value);
 const description=el("desc").value.trim();
 const file=el("photo").files[0];
 if(!name||mrp<=0||selling_price<=0||stock<0){
  el("productMsg").textContent="नाम, MRP, बिक्री मूल्य और स्टॉक सही भरें";return;
 }
 let image_url=null;
 if(file){
  if(file.size>5*1024*1024){el("productMsg").textContent="फोटो 5 MB से छोटी रखें";return}
  const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"");
  const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
  const {error:upError}=await db.storage.from("product-images").upload(path,file,{upsert:false});
  if(upError){el("productMsg").textContent="फोटो अपलोड नहीं हुई: "+upError.message;return}
  image_url=db.storage.from("product-images").getPublicUrl(path).data.publicUrl;
 }
 el("productMsg").textContent="सेव हो रहा है...";
 const {error}=await db.from("products").insert({
  name,description,image_url,mrp,selling_price,stock,active:true
 });
 if(error){el("productMsg").textContent="सेव नहीं हुआ: "+error.message;return}
 el("productMsg").textContent="सामान सफलतापूर्वक सेव हो गया";
 ["pname","mrp","price","stock","desc","photo"].forEach(id=>el(id).value="");
 el("preview").classList.add("hidden");
 loadAll();
}

async function loadAll(){await loadProducts();await loadOrders()}

async function loadProducts(){
 const box=el("productList");
 const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});
 if(error){box.textContent=error.message;return}
 box.innerHTML=(data||[]).map(p=>`
 <div class="item">
 ${p.image_url?`<img class="preview" src="${safe(p.image_url)}">`:""}
 <b>${safe(p.name)}</b><br>
 MRP: ${rupees(p.mrp)} | बिक्री: ${rupees(p.selling_price)}<br>
 स्टॉक: ${p.stock} | ${p.active?"दिख रहा है":"छिपा हुआ"}<br>
 <button onclick="toggleProduct(${p.id},${!p.active})">${p.active?"दुकान से छिपाएँ":"दुकान में दिखाएँ"}</button>
 </div>`).join("")||"अभी कोई सामान नहीं है";
}

async function toggleProduct(id,active){
 const {error}=await db.from("products").update({active}).eq("id",id);
 if(error)alert(error.message);
 loadProducts();
}

async function loadOrders(){
 const box=el("orderList");
 const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});
 if(error){box.textContent=error.message;return}
 box.innerHTML=(data||[]).map(o=>`
 <div class="item">
 <b>ऑर्डर #${safe(o.id)}</b>
 <p>ग्राहक: ${safe(o.customer_name)}</p>
 <p>मोबाइल: ${safe(o.customer_mobile)}</p>
 <p>कुल: ${rupees(o.total_amount)}</p>
 <p>स्थिति: ${safe(o.status)}</p>
 <button onclick="setStatus(${o.id},'confirmed')">स्वीकार करें</button>
 <button class="green" onclick="setStatus(${o.id},'delivered')">डिलीवर</button>
 <button class="red" onclick="setStatus(${o.id},'cancelled')">रद्द करें</button>
 </div>`).join("")||"अभी कोई ऑर्डर नहीं है";
}

async function setStatus(id,status){
 const {error}=await db.from("orders").update({status}).eq("id",id);
 if(error){alert(error.message);return}
 loadOrders();
}

db.auth.onAuthStateChange(()=>checkLogin());
checkLogin();
</script>
</body>
</html>
