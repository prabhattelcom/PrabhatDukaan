
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prabhat Dukaan</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f3;color:#222}
header{background:#138a43;color:white;padding:20px;text-align:center}
header h1{margin:0;font-size:26px}
header p{margin:6px 0 0}
.container{padding:15px;max-width:650px;margin:auto}
h2{color:#138a43}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product{background:white;padding:14px;border-radius:12px;box-shadow:0 2px 7px #ddd}
.product h3{font-size:16px;margin:5px 0}
.price{font-weight:bold;color:#138a43;margin:8px 0}
button{border:0;border-radius:8px;padding:11px;background:#138a43;color:white;font-size:15px;cursor:pointer}
.product button{width:100%}
.cart,.customer{background:white;padding:15px;margin-top:18px;border-radius:12px;box-shadow:0 2px 7px #ddd}
.cart-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
input{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
.total{font-size:19px;font-weight:bold;margin-top:12px}
.whatsapp{width:100%;background:#128c4a;font-size:17px;margin-top:12px}
.note{font-size:13px;color:#666}
</style>
</head>
<body>

<header>
<h1>Prabhat Dukaan</h1>
<p>Prabhat Telecom</p>
<p>आपका अपना ऑनलाइन स्टोर</p>
</header>

<div class="container">
<h2>हमारे प्रोडक्ट</h2>
<div class="products" id="products"></div>

<div class="cart">
<h2>आपकी खरीदारी</h2>
<div id="cartItems">अभी कार्ट खाली है।</div>
<div class="total">कुल: ₹<span id="total">0</span></div>
</div>

<div class="customer">
<h2>ग्राहक की जानकारी</h2>
<input id="customerName" type="text" placeholder="अपना नाम लिखें">
<input id="customerMobile" type="tel" maxlength="10" placeholder="अपना 10 अंकों का मोबाइल नंबर">
<button class="whatsapp" onclick="sendOrder()">WhatsApp पर ऑर्डर भेजें</button>
<p class="note">ऑर्डर भेजने के लिए WhatsApp खुलेगा। वहाँ मैसेज देखकर Send दबाएँ।</p>
</div>
</div>

<script>
const WHATSAPP_NUMBER = "918858868886";

const products = [
{name:"Dabur Honey",price:120},
{name:"Vatika Shampoo",price:90},
{name:"Dettol",price:50},
{name:"MamyPoko Pants",price:250},
{name:"Bajaj Almond Oil",price:75},
{name:"Everest Masala",price:45},
{name:"Pulse Candy",price:10},
{name:"Dant Kanti",price:60}
];

let cart = [];

function showProducts(){
const area = document.getElementById("products");
area.innerHTML = "";
products.forEach((p,index)=>{
area.innerHTML += `
<div class="product">
<h3>${p.name}</h3>
<div class="price">₹${p.price}</div>
<button onclick="addToCart(${index})">कार्ट में जोड़ें</button>
</div>`;
});
}

function addToCart(index){
const product = products[index];
const found = cart.find(item=>item.name===product.name);
if(found){found.qty++;}
else{cart.push({...product,qty:1});}
showCart();
}

function showCart(){
const area = document.getElementById("cartItems");
if(cart.length===0){
area.innerHTML="अभी कार्ट खाली है।";
}else{
area.innerHTML=cart.map((item,index)=>`
<div class="cart-item">
<span>${item.name} × ${item.qty}</span>
<span>
₹${item.price*item.qty}
<button onclick="removeItem(${index})" style="background:#d33;padding:5px 9px">हटाएँ</button>
</span>
</div>`).join("");
}
const total = cart.reduce((sum,item)=>sum+item.price*item.qty,0);
document.getElementById("total").innerText=total;
}

function removeItem(index){
cart.splice(index,1);
showCart();
}

function sendOrder(){
const name=document.getElementById("customerName").value.trim();
const mobile=document.getElementById("customerMobile").value.trim();

if(!name){
alert("कृपया अपना नाम लिखें।");
return;
}
if(!/^[6-9][0-9]{9}$/.test(mobile)){
alert("कृपया सही 10 अंकों का मोबाइल नंबर लिखें।");
return;
}
if(cart.length===0){
alert("कृपया पहले कोई प्रोडक्ट कार्ट में जोड़ें।");
return;
}

const total=cart.reduce((sum,item)=>sum+item.price*item.qty,0);

let message="नमस्ते Prabhat Telecom,%0Aमुझे ये सामान ऑर्डर करना है।";
message="\nनमस्ते Prabhat Telecom,\nमुझे ये सामान ऑर्डर करना है।";
message+="\n\nग्राहक का नाम: "+name;
message+="\nमोबाइल नंबर: "+mobile;
message+="\n\nऑर्डर की जानकारी:";

cart.forEach(item=>{
message+="\n"+item.name+" × "+item.qty+" = ₹"+(item.price*item.qty);
});

message+="\n\nकुल राशि: ₹"+total;
message+="\n\nकृपया मेरा ऑर्डर कन्फर्म करें।";

const url="https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(message);
window.location.href=url;
}

showProducts();
showCart();
</script>
</body>
</html>
