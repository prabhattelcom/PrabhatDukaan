
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prabhat Dukaan - Prabhat Telecom</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#222}
header{background:#123d70;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:6px 0 0}
nav{display:flex;gap:8px;justify-content:center;padding:12px;background:white;flex-wrap:wrap}
button{border:0;border-radius:7px;padding:11px 15px;background:#1264ad;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px;font-size:15px}
main{max-width:950px;margin:auto;padding:15px}
.panel{background:white;padding:15px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.product{background:white;padding:10px;border-radius:10px;box-shadow:0 2px 8px #0001}
.product img{width:100%;height:125px;object-fit:contain;background:#f7f7f7}
.price{color:#087a39;font-weight:bold;font-size:18px}
.old{color:#888;text-decoration:line-through;font-size:13px}
.hidden{display:none}
.small{font-size:13px;color:#666}
h2{font-size:20px}
</style>
</head>
<body>
<header>
<h1>🛍️ Prabhat Dukaan</h1>
<p>Prabhat Telecom | आपका अपना ऑनलाइन स्टोर</p>
</header>

<nav>
<button onclick="showPage('shop')">दुकान</button>
<button onclick="showPage('cart')">🛒 कार्ट (<span id="cartCount">0</span>)</button>
<button onclick="showPage('admin')">Admin Login</button>
</nav>

<main>
<section id="shop">
<div class="panel">
<h2>हमारे प्रोडक्ट</h2>
<p class="small">अपनी पसंद का सामान चुनें और ऑर्डर करें।</p>
</div>
<div id="products" class="products">सामान लोड हो रहा है...</div>
</section>

<section id="cart" class="hidden">
<div class="panel">
<h2>आपका कार्ट</h2>
<div id="cartItems"></div>
<h3 id="cartTotal">कुल: ₹0</h3>
<h3>ऑर्डर करने के लिए जानकारी भरें</h3>
<input id="customerName" placeholder="आपका नाम">
<input id="customerMobile" placeholder="मोबाइल नंबर" inputmode="numeric">
<button onclick="placeOrder()">ऑर्डर भेजें</button>
</div>
</section>

<section id="admin" class="hidden">
<div class="panel" id="loginBox">
<h2>Admin Login</h2>
<input id="adminEmail" type="email" placeholder="Admin Email" value="prbhtm@gmail.com">
<input id="adminPassword" type="password" placeholder="Admin Password">
<button onclick="adminLogin()">लॉगिन करें</button>
<p id="loginMessage"></p>
</div>

<div class="hidden" id="adminPanel">
<div class="panel">
<h2>Admin Dashboard</h2>
<p id="adminWelcome"></p>
<button onclick="loadAdmin()">रिफ्रेश करें</button>
<button onclick="adminLogout()">लॉगआउट</button>
</div>

<div class="panel">
<h2>नया सामान जोड़ें</h2>
<input id="pName" placeholder="प्रोडक्ट का नाम">
<input id="pMrp" type="number" placeholder="MRP कीमत">
<input id="pPrice" type="number" placeholder="बिक्री कीमत">
<input id="pStock" type="number" placeholder="स्टॉक संख्या">
<input id="pImage" placeholder="फोटो का URL (वैकल्पिक)">
<textarea id="pDescription" placeholder="प्रोडक्ट की जानकारी"></textarea>
<button onclick="addProduct()">सामान सेव करें</button>
<p id="productMessage"></p>
</div>

<div class="panel">
<h2>आपके प्रोडक्ट</h2>
<div id="adminProducts"></div>
</div>

<div class="panel">
<h2>ग्राहकों के ऑर्डर</h2>
<div id="adminOrders"></div>
</div>
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://zbsmdnccdpidksgavtxl.supabase.co";
const SUPABASE_KEY = "sb_publishable_jIxfhg8WH0x0XH3edKOA5Q_jAFQl1v2";
const ADMIN_EMAIL = "prbhtm@gmail.com";
const WHATSAPP_NUMBER = "918858868886";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let products = [];
let cart = [];

function showPage(page){
["shop","cart","admin"].forEach(id=>{
document.getElementById(id).classList.toggle("hidden",id!==page);
});
if(page==="cart") renderCart();
if(page==="admin") checkAdmin();
}

function money(n){return "₹"+Number(n||0).toFixed(2)}

async function loadProducts(){
const box=document.getElementById("products");
const {data,error}=await db.from("products").select("*").eq("is_active",true).order("created_at",{ascending:false});
if(error){box.innerHTML="प्रोडक्ट लोड नहीं हुए: "+error.message;return}
products=data||[];
if(!products.length){box.innerHTML="अभी कोई सामान उपलब्ध नहीं है।";return}
box.innerHTML=products.map(p=>`
<div class="product">
<img src="${safe(p.image_url||"")}" onerror="this.style.display='none'">
<h3>${safe(p.name)}</h3>
<p class="small">${safe(p.description||"")}</p>
<div class="old">${money(p.mrp)}</div>
<div class="price">${money(p.price)}</div>
<p class="small">स्टॉक: ${Number(p.stock||0)}</p>
<button onclick="addCart('${p.id}')">कार्ट में डालें</button>
</div>`).join("");
}

function safe(value){
return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function addCart(id){
const p=products.find(x=>String(x.id)===String(id));
if(!p)return;
if(Number(p.stock)<=0){alert("यह सामान अभी स्टॉक में नहीं है");return}
const old=cart.find(x=>String(x.id)===String(id));
if(old){if(old.qty>=Number(p.stock)){alert("इतना स्टॉक उपलब्ध नहीं है");return}old.qty++}
else cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1});
renderCart();
alert("सामान कार्ट में जुड़ गया");
}

function renderCart(){
document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0);
const box=document.getElementById("cartItems");
if(!cart.length){box.innerHTML="आपका कार्ट खाली है";document.getElementById("cartTotal").textContent="कुल: ₹0";return}
box.innerHTML=cart.map((x,i)=>`
<div class="panel">
<b>${safe(x.name)}</b><br>${money(x.price)} × ${x.qty}
<button onclick="changeQty(${i},-1)">−</button>
<button onclick="changeQty(${i},1)">+</button>
<button onclick="removeItem(${i})">हटाएँ</button>
</div>`).join("");
const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
document.getElementById("cartTotal").textContent="कुल: "+money(total);
}

function changeQty(i,n){
if(!cart[i])return;
const p=products.find(x=>String(x.id)===String(cart[i].id));
cart[i].qty+=n;
if(cart[i].qty<=0)cart.splice(i,1);
else if(p&&cart[i].qty>Number(p.stock)){cart[i].qty=Number(p.stock);alert("स्टॉक से ज्यादा सामान नहीं जोड़ सकते")}
renderCart();
}
function removeItem(i){cart.splice(i,1);renderCart()}

async function placeOrder(){
const name=document.getElementById("customerName").value.trim();
const mobile=document.getElementById("customerMobile").value.trim();
if(!name||!/^[0-9]{10}$/.test(mobile)){alert("नाम और सही 10 अंकों का मोबाइल नंबर भरें");return}
if(!cart.length){alert("पहले सामान कार्ट में डालें");return}
const items=cart.map(x=>({product_id:x.id,quantity:x.qty}));
const {data,error}=await db.rpc("place_order",{
p_customer_name:name,
p_customer_mobile:mobile,
p_items:items
});
if(error){alert("ऑर्डर नहीं हुआ: "+error.message);return}
const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
let msg="नया ऑर्डर - Prabhat Dukaan\nनाम: "+name+"\nमोबाइल: "+mobile+"\n";
cart.forEach(x=>msg+=x.name+" × "+x.qty+" = "+money(x.price*x.qty)+"\n");
msg+="कुल: "+money(total);
cart=[];
renderCart();
alert("ऑर्डर दर्ज हो गया। अब WhatsApp खुलेगा।");
window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(msg),"_blank");
loadProducts();
}

async function adminLogin(){
const email=document.getElementById("adminEmail").value.trim();
const password=document.getElementById("adminPassword").value;
const msg=document.getElementById("loginMessage");
if(email.toLowerCase()!==ADMIN_EMAIL){msg.textContent="यह Admin Email सही नहीं है";return}
const {data,error}=await db.auth.signInWithPassword({email,password});
if(error){msg.textContent="लॉगिन नहीं हुआ: "+error.message;return}
checkAdmin();
}

async function checkAdmin(){
const {data}=await db.auth.getSession();
const user=data.session?.user;
if(user&&user.email?.toLowerCase()===ADMIN_EMAIL){
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("adminPanel").classList.remove("hidden");
document.getElementById("adminWelcome").textContent="लॉगिन: "+user.email;
loadAdmin();
}else{
document.getElementById("loginBox").classList.remove("hidden");
document.getElementById("adminPanel").classList.add("hidden");
}
}

async function adminLogout(){
await db.auth.signOut();
checkAdmin();
}

async function addProduct(){
const name=document.getElementById("pName").value.trim();
const mrp=Number(document.getElementById("pMrp").value);
const price=Number(document.getElementById("pPrice").value);
const stock=Number(document.getElementById("pStock").value);
const image_url=document.getElementById("pImage").value.trim();
const description=document.getElementById("pDescription").value.trim();
const msg=document.getElementById("productMessage");
if(!name||!mrp||!price||stock<0){msg.textContent="सभी जरूरी जानकारी सही भरें";return}
const {error}=await db.from("products").insert([{name,mrp,price,stock,image_url,description,is_active:true}]);
if(error){msg.textContent="सेव नहीं हुआ: "+error.message;return}
msg.textContent="प्रोडक्ट सेव हो गया";
["pName","pMrp","pPrice","pStock","pImage","pDescription"].forEach(id=>document.getElementById(id).value="");
loadAdmin();
loadProducts();
}

async function loadAdmin(){
const pbox=document.getElementById("adminProducts");
const obox=document.getElementById("adminOrders");
const {data:pdata,error:pe}=await db.from("products").select("*").order("created_at",{ascending:false});
if(pe)pbox.textContent=pe.message;
else pbox.innerHTML=(pdata||[]).map(p=>`
<div class="panel">
<b>${safe(p.name)}</b> - ${money(p.price)} - स्टॉक ${p.stock}
<button onclick="toggleProduct('${p.id}',${!p.is_active})">${p.is_active?"छिपाएँ":"दिखाएँ"}</button>
</div>`).join("")||"कोई प्रोडक्ट नहीं";

const {data:orders,error:oe}=await db.from("orders").select("*").order("created_at",{ascending:false});
if(oe){obox.textContent="ऑर्डर लोड नहीं हुए: "+oe.message;return}
if(!orders?.length){obox.textContent="अभी कोई ऑर्डर नहीं है";return}
obox.innerHTML=orders.map(o=>`
<div class="panel">
<b>ऑर्डर #${safe(o.id)}</b>
<p>कुल: ${money(o.total)}</p>
<p>स्थिति: ${safe(o.status||"नया")}</p>
<button onclick="updateStatus('${o.id}','confirmed')">स्वीकार करें</button>
<button onclick="updateStatus('${o.id}','delivered')">डिलीवर</button>
<button onclick="updateStatus('${o.id}','cancelled')">रद्द करें</button>
</div>`).join("");
}

async function toggleProduct(id,active){
const {error}=await db.from("products").update({is_active:active}).eq("id",id);
if(error)alert(error.message);
loadAdmin();loadProducts();
}

async function updateStatus(id,status){
const {error}=await db.from("orders").update({status}).eq("id",id);
if(error){alert("स्थिति नहीं बदली: "+error.message);return}
loadAdmin();
}

db.auth.onAuthStateChange(()=>checkAdmin());
loadProducts();
</script>
</body>
</html>
