
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prabhat Dukaan Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f1f4f9;margin:0;color:#17243a}
header{background:#102d55;color:white;text-align:center;padding:22px}
main{max-width:650px;margin:auto;padding:14px}
.card{background:white;padding:17px;margin:14px 0;border-radius:12px}
input,textarea{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #bbb;border-radius:8px;font-size:16px}
button{padding:12px 17px;background:#145ba0;color:white;border:0;border-radius:8px;margin:5px;cursor:pointer}
.green{background:#16804a}.red{background:#b72d32}
.hidden{display:none}
.item{padding:12px 0;border-bottom:1px solid #ddd}
img{max-width:130px;max-height:130px;display:block;margin:8px}
</style>
</head>
<body>
<header>
<h1>PT</h1>
<h2>Prabhat Dukaan</h2>
Prabhat Telecom Admin
</header>
<main>
<div id="error" class="card" style="color:#b72d32"></div>
<section id="login" class="card">
<h3>Admin Login</h3>
<input id="email" type="email" value="prbhtm@gmail.com" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn" onclick="loginAdmin()">Login करें</button>
<p id="loginMsg"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h3>Admin Dashboard</h3>
<p id="welcome"></p>
<button onclick="loadAll()">Refresh</button>
<button class="red" onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>नया सामान जोड़ें</h3>
<input id="pname" placeholder="सामान का नाम">
<input id="mrp" type="number" placeholder="MRP">
<input id="price" type="number" placeholder="बिक्री मूल्य">
<input id="stock" type="number" placeholder="स्टॉक">
<textarea id="desc" placeholder="सामान की जानकारी"></textarea>
<p>Gallery से फोटो चुनें</p>
<input id="photo" type="file" accept="image/*">
<img id="preview" class="hidden">
<button class="green" onclick="saveProduct()">सामान सेव करें</button>
<p id="productMsg"></p>
</div>

<div class="card">
<h3>प्रोडक्ट सूची</h3>
<div id="productList"></div>
</div>

<div class="card">
<h3>ग्राहकों के ऑर्डर</h3>
<div id="orderList"></div>
</div>
</section>
</main>

<script>
const SUPABASE_URL="https://zbsmdnccdpidksgavtxl.supabase.co";
const SUPABASE_KEY="sb_publishable_jIxfhg8WH0x0XH3edKOA5Q_jAFQl1v2";
const ADMIN_EMAIL="prbhtm@gmail.com";
let db=null;

function message(id,msg){document.getElementById(id).textContent=msg;}

try{
 if(!window.supabase){
  throw new Error("Supabase इंटरनेट से लोड नहीं हुआ। इंटरनेट चालू करके ऐप खोलें।");
 }
 db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 message("error","");
}catch(e){
 message("error","ऐप की समस्या: "+e.message);
}

async function loginAdmin(){
 if(!db){message("loginMsg","Supabase कनेक्शन उपलब्ध नहीं है।");return;}
 const btn=document.getElementById("loginBtn");
 btn.disabled=true;
 message("loginMsg","लॉगिन हो रहा है...");
 try{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  if(email.toLowerCase()!==ADMIN_EMAIL){throw new Error("Admin Email गलत है");}
  if(!password){throw new Error("पासवर्ड डालिए");}
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error)throw error;
  if(data.user.email.toLowerCase()!==ADMIN_EMAIL)throw new Error("यह Admin अकाउंट नहीं है");
  showDashboard();
 }catch(e){
  message("loginMsg","Login Error: "+e.message);
 }finally{
  btn.disabled=false;
 }
}

function showDashboard(){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 message("welcome","लॉगिन सफल: "+ADMIN_EMAIL);
 loadAll();
}

async function checkSession(){
 if(!db)return;
 try{
  const {data,error}=await db.auth.getSession();
  if(error)throw error;
  if(data.session?.user?.email?.toLowerCase()===ADMIN_EMAIL)showDashboard();
 }catch(e){message("error","कनेक्शन समस्या: "+e.message);}
}

async function logout(){
 await db.auth.signOut();
 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
 message("loginMsg","आप लॉगआउट हो गए हैं।");
}

document.getElementById("photo").addEventListener("change",function(){
 const file=this.files[0];
 if(file){
  document.getElementById("preview").src=URL.createObjectURL(file);
  document.getElementById("preview").classList.remove("hidden");
 }
});

async function saveProduct(){
 try{
  const name=document.getElementById("pname").value.trim();
  const mrp=Number(document.getElementById("mrp").value);
  const selling_price=Number(document.getElementById("price").value);
  const stock=Number(document.getElementById("stock").value);
  const description=document.getElementById("desc").value.trim();
  const file=document.getElementById("photo").files[0];
  if(!name||mrp<=0||selling_price<=0||stock<0)throw new Error("सभी जानकारी सही भरें");
  let image_url=null;
  if(file){
   if(file.size>5*1024*1024)throw new Error("फोटो 5 MB से छोटी रखें");
   const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"");
   const path=Date.now()+"."+ext;
   const {error}=await db.storage.from("product-images").upload(path,file);
   if(error)throw error;
   image_url=db.storage.from("product-images").getPublicUrl(path).data.publicUrl;
  }
  message("productMsg","सेव हो रहा है...");
  const {error}=await db.from("products").insert({
   name,mrp,selling_price,stock,description,image_url,active:true
  });
  if(error)throw error;
  message("productMsg","सामान सफलतापूर्वक सेव हो गया");
  ["pname","mrp","price","stock","desc","photo"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("preview").classList.add("hidden");
  loadAll();
 }catch(e){message("productMsg","समस्या: "+e.message);}
}

async function loadAll(){
 await loadProducts();
 await loadOrders();
}

async function loadProducts(){
 const box=document.getElementById("productList");
 box.textContent="लोड हो रहा है...";
 const {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});
 if(error){box.textContent=error.message;return;}
 box.innerHTML=(data||[]).map(p=>`
 <div class="item">
 <b>${escapeHTML(p.name)}</b><br>
 MRP ₹${p.mrp} | बिक्री ₹${p.selling_price}<br>
 स्टॉक: ${p.stock}<br>
 ${p.image_url?`<img src="${escapeHTML(p.image_url)}">`:""}
 <button onclick="toggleProduct(${p.id},${!p.active})">${p.active?"छिपाएँ":"दिखाएँ"}</button>
 </div>`).join("")||"कोई सामान नहीं है";
}

async function toggleProduct(id,active){
 const {error}=await db.from("products").update({active}).eq("id",id);
 if(error)alert(error.message);
 loadProducts();
}

async function loadOrders(){
 const box=document.getElementById("orderList");
 box.textContent="लोड हो रहा है...";
 const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});
 if(error){box.textContent=error.message;return;}
 box.innerHTML=(data||[]).map(o=>`
 <div class="item">
 <b>ऑर्डर #${o.id}</b>
 <p>ग्राहक: ${escapeHTML(o.customer_name)}</p>
 <p>मोबाइल: ${escapeHTML(o.customer_mobile)}</p>
 <p>कुल: ₹${o.total_amount}</p>
 <p>स्थिति: ${escapeHTML(o.status)}</p>
 <button onclick="setStatus(${o.id},'confirmed')">स्वीकार करें</button>
 <button class="green" onclick="setStatus(${o.id},'delivered')">डिलीवर</button>
 <button class="red" onclick="setStatus(${o.id},'cancelled')">रद्द करें</button>
 </div>`).join("")||"अभी कोई ऑर्डर नहीं है";
}

async function setStatus(id,status){
 const {error}=await db.from("orders").update({status}).eq("id",id);
 if(error){alert(error.message);return;}
 loadOrders();
}

function escapeHTML(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

checkSession();
</script>
</body>
</html>
